<header th:fragment="topbar" class="flex justify-between items-center mb-3">
    <div class="md:hidden">
        <h1 class="font-headline-md text-[24px] font-bold text-primary">Be Fair!</h1>
    </div>
    <div class="hidden md:block"></div>
    <div class="flex items-center gap-4">
    	<form th:action="@{/logout}" method="post" class="inline">
		    <button type="submit" class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors cursor-pointer">
		        Logout
		    </button>
		</form>
        <div class="flex items-center gap-3 bg-white p-1 pr-4 rounded-full shadow-sm border border-outline-variant/20">
        	
            <img th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : 'https://ui-avatars.com/api/?name=' + currentUser.fullName}" class="w-8 h-8 rounded-full object-cover"/>
            <span th:text="${currentUser.fullName}" class="font-label-md text-[14px] text-on-surface"></span>
        </div>
    </div>
</header>
