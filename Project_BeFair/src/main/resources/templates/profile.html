<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{fragments/head :: head}"></div>
    <title>Hồ sơ cá nhân - BeFair</title>
</head>
<body class="h-screen overflow-x-hidden">

    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="md:ml-60 h-screen px-margin-mobile md:px-margin-desktop py-3 mx-auto flex flex-col">
        <div th:replace="~{fragments/header :: topbar}"></div>

        <div th:if="${successMessage}" class="toast-message fixed top-5 right-5 z-[999] bg-emerald-500 text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-lg flex items-center gap-2">
            <span class="material-symbols-outlined text-base">check_circle</span>
            <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="toast-message fixed top-5 right-5 z-[999] bg-rose-500 text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-lg flex items-center gap-2">
            <span class="material-symbols-outlined text-base">error</span>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="flex items-center pt-1 px-5 mb-6">
            <h1 class="text-4xl font-black text-slate-900">Hồ sơ cá nhân</h1>
        </div>

        <div class="px-5 flex-1 overflow-y-auto custom-scroll pb-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-4xl">

                <div class="bg-white rounded-3xl shadow-[0_5px_10px_10px_rgba(0,0,0,0.05)] border border-slate-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 border-t-8 border-t-primary/40 bg-slate-50/50 flex items-center gap-3">
                        <div class="w-10 h-10 bg-teal-100 text-teal-600 rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                        <h3 class="font-black text-xl text-slate-800">Thông tin cá nhân</h3>
                    </div>

                    <form th:action="@{/profile/update}" method="post" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Họ và tên</label>
                            <input type="text" name="fullName" required
                                   th:value="${currentUser.fullName}"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Email</label>
                            <input type="email" name="email"
                                   th:value="${currentUser.email}"
                                   placeholder="example@email.com"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Số điện thoại</label>
                            <input type="tel" name="phoneNumber"
                                   th:value="${currentUser.phoneNumber}"
                                   placeholder="0xxxxxxxxx"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
                        </div>

                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-2xl font-black shadow-lg shadow-teal-200 transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-base">save</span>
                            Lưu thông tin
                        </button>
                    </form>
                </div>

                <div class="bg-white rounded-3xl shadow-[0_5px_10px_10px_rgba(0,0,0,0.05)] border border-slate-100 overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 border-t-8 border-t-indigo-400/40 bg-slate-50/50 flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center">
                            <span class="material-symbols-outlined">account_balance</span>
                        </div>
                        <h3 class="font-black text-xl text-slate-800">Thông tin ngân hàng</h3>
                    </div>

                    <form th:action="@{/profile/update}" method="post" class="p-6 space-y-4">

                        <input type="hidden" name="fullName" th:value="${currentUser.fullName}">
                        <input type="hidden" name="email" th:value="${currentUser.email}">
                        <input type="hidden" name="phoneNumber" th:value="${currentUser.phoneNumber}">

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Ngân hàng</label>
                            <select name="bankCode" id="bankSelect"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
                                <option value="">-- Đang tải danh sách ngân hàng... --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Số tài khoản</label>
                            <input type="text" name="bankAccount"
                                   th:value="${currentUser.bankAccount}"
                                   placeholder="Nhập số tài khoản"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all">
                        </div>

                        <div th:if="${currentUser.bankAccount != null and currentUser.bankCode != null}"
                             class="p-3 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center gap-3">
                            <span class="material-symbols-outlined text-emerald-500">check_circle</span>
                            <div>
                                <p class="text-xs font-bold text-emerald-700">Đã cập nhật thông tin ngân hàng</p>
                                <p class="text-xs text-emerald-600" th:text="'STK: ' + ${currentUser.bankAccount}"></p>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-black shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-base">save</span>
                            Lưu thông tin ngân hàng
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
	<div id="globalExpenseModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
	    <div class="bg-white rounded-3xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
	        
	        <div class="p-6 border-b flex justify-between items-center bg-slate-50">
	            <h3 class="text-xl font-black flex items-center gap-2 text-slate-800">
	                <span class="material-symbols-outlined text-[rgb(6,149,133)]">add_notes</span> Thêm hóa đơn nhanh
	            </h3>
	            <button onclick="closeGlobalExpenseModal()" class="text-slate-400 hover:text-rose-500 transition-colors">
	                <span class="material-symbols-outlined">close</span>
	            </button>
	        </div>
	        
	        <form id="globalExpenseForm" method="post" enctype="multipart/form-data" class="p-6 space-y-5 overflow-y-auto custom-scroll">
	            
	            <div>
	                <label class="block text-xs font-bold text-slate-500 uppercase mb-2 tracking-wide">Chọn chuyến đi / Nhóm chi tiêu</label>
	                <select id="modalGroupSelect" required onchange="onGroupSelectionChange(this.value)"
	                        class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 font-bold text-slate-700 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition-all">
	                    <option value="" disabled selected>-- Chọn nhóm muốn thêm hóa đơn --</option>
	                    <option th:each="g : ${groups}" th:value="${g.id}" th:text="${g.name}"></option>
	                </select>
	            </div>
	
	            <div id="expenseFormFields" class="space-y-5 opacity-40 pointer-events-none transition-all duration-300">
	                
	                <div class="grid grid-cols-2 gap-4">
	                    <div class="col-span-2">
	                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Hóa đơn cho việc gì?</label>
	                        <input name="description" required class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition-all" placeholder="VD: Ăn lẩu, Tiền phòng Villa..." type="text"/>
	                    </div>
	                    <div>
	                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Số tiền (VNĐ)</label>
	                        <input id="global-currency-input" required class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 font-bold text-[rgb(6,149,133)] focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition-all" placeholder="0" type="text"/>
	                        <input type="hidden" name="amount" id="global-real-amount">
	                    </div>
	                    <div>
	                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Người chi trả</label>
	                        <select id="modalPayerSelect" name="payerId" required class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 focus:bg-white focus:ring-2 focus:ring-teal-500 outline-none transition-all">
	                            <option value="">Chọn người trả...</option>
	                        </select>
	                    </div>
	                </div>
	
	                <div>
	                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Áp dụng nợ cho ai?</label>
	                    <div id="modalSharersContainer" class="bg-slate-50 p-4 rounded-md space-y-2 max-h-40 overflow-y-auto custom-scroll border border-slate-200">
	                        <p class="text-xs text-slate-400 italic">Vui lòng chọn nhóm trước...</p>
	                    </div>
	                    <p class="text-[10px] text-slate-400 mt-2 italic">* Chỉ những người được tích mới phải gánh nợ hóa đơn này.</p>
	                </div>
	
	                <div>
	                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Ảnh hóa đơn (Nếu có)</label>
	                    <input name="imageFile" type="file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 cursor-pointer"/>
	                </div>
	
	                <button type="submit" class="w-full bg-[rgb(6,149,133)] hover:bg-[rgb(0,108,95)] text-white py-4 rounded-2xl font-black shadow-lg shadow-teal-200/50 transition-all mt-4 uppercase tracking-wide">
	                    LƯU HÓA ĐƠN GIAO DỊCH
	                </button>
	            </div>
	            
	        </form>
	    </div>
	</div>
    <script>
        async function loadBanks() {
            const select = document.getElementById('bankSelect');
            const currentBankCode = '[[${currentUser.bankCode}]]';

            try {
                const res = await fetch('https://api.vietqr.io/v2/banks');
                const data = await res.json();

                select.innerHTML = '<option value="">-- Chọn ngân hàng --</option>';
                data.data.forEach(bank => {
                    const option = document.createElement('option');
                    option.value = bank.bin;
                    option.textContent = bank.shortName + ' - ' + bank.name;
                    if (bank.bin === currentBankCode) option.selected = true;
                    select.appendChild(option);
                });
            } catch (err) {
                select.innerHTML = '<option value="">-- Không tải được danh sách ngân hàng --</option>';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadBanks();
            const toasts = document.querySelectorAll('.toast-message');
            toasts.forEach(toast => {
                toast.classList.add('toast-enter');
                setTimeout(() => {
                    toast.classList.remove('toast-enter');
                    toast.classList.add('toast-exit');
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            });
        });
        function openGlobalExpenseModal() {
            document.getElementById('globalExpenseModal').classList.remove('hidden');
        }

        function closeGlobalExpenseModal() {
            document.getElementById('globalExpenseModal').classList.add('hidden');
            document.getElementById('globalExpenseForm').reset();
            onGroupSelectionChange(""); 
        }

        function onGroupSelectionChange(groupId) {
            const formFields = document.getElementById('expenseFormFields');
            const formAction = document.getElementById('globalExpenseForm');
            const payerSelect = document.getElementById('modalPayerSelect');
            const sharersContainer = document.getElementById('modalSharersContainer');
            
            if (!groupId) {
                formFields.classList.add('opacity-40', 'pointer-events-none');
                payerSelect.innerHTML = '<option value="">Chọn người trả...</option>';
                sharersContainer.innerHTML = '<p class="text-xs text-slate-400 italic">Vui lòng chọn nhóm trước...</p>';
                return;
            }
            
            formFields.classList.remove('opacity-40', 'pointer-events-none');
            formAction.action = `/group/${groupId}/add-expense`;
            
            const members = groupMembersMap[groupId] || [];
            
            let payerHtml = '<option value="" disabled selected>Chọn người trả...</option>';
            members.forEach(m => {
                payerHtml += `<option value="${m.id}">${m.name}</option>`;
            });
            payerSelect.innerHTML = payerHtml;
            
            let sharersHtml = '';
            if (members.length === 0) {
                sharersHtml = '<p class="text-xs text-rose-400 italic">Nhóm này chưa có thành viên nào!</p>';
            } else {
                members.forEach(m => {
                    sharersHtml += `
                        <div class="flex items-center gap-3 py-1.5 px-2 hover:bg-slate-100 rounded-lg transition-colors">
                            <input type="checkbox" name="sharerIds" value="${m.id}" checked class="rounded text-teal-600 focus:ring-teal-500 h-4 w-4 cursor-pointer">
                            <span class="text-sm font-medium text-slate-700 select-none">${m.name}</span>
                        </div>
                    `;
                });
            }
            sharersContainer.innerHTML = sharersHtml;
        }

        document.getElementById('global-currency-input').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value !== "") {
                e.target.value = new Intl.NumberFormat('en-US').format(value);
            } else {
                e.target.value = "";
            }
            document.getElementById('global-real-amount').value = value;
        });
    </script>
</body>
</html>
